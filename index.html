<title>Амин</title>

<style>
:root {
  --bg: #F1F1EF;
  --surface: #FFFFFF;
  --surface2: #E7E7E4;
  --fg: #141414;
  --muted: #5E5E5E;
  --line: #D9D9D6;
  --accent: #1A1A1A;
  --accent-fg: #FFFFFF;
  --danger: #A63A2B;
  --ok: #2E6F40;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 10px 22px -16px rgba(0, 0, 0, 0.3);
  --c-art: #9A5A4A;
  --c-psy: #4C7A7C;
  --c-lit: #7C5A7A;
  --c-phil: #5E6490;
  --c-music: #8A7440;
  --c-theatre: #94505F;
  --c-cin: #5E7080;
  --c-game: #5E7A4C;
  --c-sport: #7E6448;
  --c-custom1: #4A7A68;
  --c-custom2: #7A5468;
  --c-custom3: #5A6B82;
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0B0C;
    --surface: #151516;
    --surface2: #1E1E20;
    --fg: #ECECEA;
    --muted: #9A9A9A;
    --line: #2A2A2C;
    --accent: #E8E8E6;
    --accent-fg: #0B0B0C;
    --danger: #E58A7A;
    --ok: #6EC487;
    --shadow: none;
    --c-art: #C48C7C;
    --c-psy: #86B2B4;
    --c-lit: #B494B2;
    --c-phil: #9AA0CC;
    --c-music: #C4AE78;
    --c-theatre: #C48C98;
    --c-cin: #98AAB8;
    --c-game: #98B488;
    --c-sport: #B89A7C;
    --c-custom1: #7CB8A2;
    --c-custom2: #B88CA2;
    --c-custom3: #8FA4C2;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  margin: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
html { height: 100%; box-sizing: border-box; }
.scroller {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(14px, env(safe-area-inset-top, 12px));
  padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
}
.shell { max-width: 720px; margin: 0 auto; }
.brand {
  margin: 0 0 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand-badge {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-transform: none;
  color: var(--muted);
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font-size: 30px; letter-spacing: -0.01em; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
p { margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

.t-art { --tc: var(--c-art); }
.t-psy { --tc: var(--c-psy); }
.t-lit { --tc: var(--c-lit); }
.t-phil { --tc: var(--c-phil); }
.t-music { --tc: var(--c-music); }
.t-theatre { --tc: var(--c-theatre); }
.t-cin { --tc: var(--c-cin); }
.t-game { --tc: var(--c-game); }
.t-sport { --tc: var(--c-sport); }
.t-c1 { --tc: var(--c-custom1); }
.t-c2 { --tc: var(--c-custom2); }
.t-c3 { --tc: var(--c-custom3); }
.t-rand { --tc: var(--accent); }
.tlabel { display: inline-flex; align-items: center; gap: 6px; color: var(--tc, var(--accent)); font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }

.ti { display: inline-flex; flex: none; }
.ava {
  position: relative; flex: none; width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--surface2); border: 2px solid var(--tc, var(--line));
  color: var(--tc, var(--muted)); font-family: var(--font-display);
  font-weight: 600; font-size: 16px; letter-spacing: 0.02em;
  overflow: visible; cursor: pointer;
}
.ava-img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; border-radius: 50%; display: block;
}
.ava .ti {
  position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--surface); border: 1px solid var(--line);
  align-items: center; justify-content: center; z-index: 2;
}
.ava .ti svg { width: 11px; height: 11px; }
.ti svg { width: 16px; height: 16px; }
.tname { display: inline-flex; align-items: center; gap: 8px; }
.tname .ti svg { width: 18px; height: 18px; color: var(--tc); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
.card.link { display: block; text-decoration: none; color: inherit; cursor: pointer; text-align: left; width: 100%; font: inherit; }
.card.link:focus-visible, .btn:focus-visible, .chip:focus-visible, .tab:focus-visible, summary:focus-visible, .check:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .ghost:focus-visible, .ava:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px;
  background: var(--accent); color: var(--accent-fg);
  border: 0; border-radius: 12px;
  font: inherit; font-weight: 600; letter-spacing: 0.01em; text-decoration: none; cursor: pointer;
}
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.alt { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.ghost { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 600; padding: 6px 0; min-height: 36px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.ghost:disabled { opacity: 0.55; cursor: not-allowed; }

.segs { display: flex; gap: 2px; margin-top: 10px; }
.seg { flex: 1; height: 5px; border-radius: 3px; background: var(--line); min-width: 2px; }
.seg.on { background: var(--tc); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.stat b { display: block; font-family: var(--font-display); font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; }

.topics { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.topic-card { border-top: 3px solid var(--tc); }
.topic-card h2 { margin: 6px 0 4px; }

.level { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 6px 0 2px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.level span { font-variant-numeric: tabular-nums; }

.step { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--tc); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
.step.done { background: var(--surface2); }
.check {
  flex: none; width: 44px; height: 44px; border-radius: 10px;
  border: 2px solid var(--line); background: var(--surface); color: var(--accent-fg);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.check[aria-pressed="true"] { background: var(--tc); border-color: var(--tc); }
.check svg { width: 22px; height: 22px; opacity: 0; }
.check[aria-pressed="true"] svg { opacity: 1; }
details { flex: 1; min-width: 0; }
summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; list-style: none; font-weight: 600; }
summary::-webkit-details-marker { display: none; }
summary .n { color: var(--tc); font-family: var(--font-display); font-variant-numeric: tabular-nums; flex: none; }
summary .chev { margin-left: auto; flex: none; transition: transform 0.15s; color: var(--muted); }
details[open] summary .chev { transform: rotate(90deg); }
.body { padding: 4px 0 8px; display: flex; flex-direction: column; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.term { background: var(--surface2); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.step.done .term { background: var(--surface); }
.task { border-left: 3px solid var(--tc); padding-left: 12px; }
textarea, input[type="text"], input[type="url"], input[type="password"], select {
  width: 100%; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px;
}
textarea:focus, input[type="text"]:focus, input[type="url"]:focus, input[type="password"]:focus, select:focus { border-color: var(--accent); }
textarea { min-height: 88px; resize: vertical; }
label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }

.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 0 14px; min-height: 40px; font: inherit; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }

.item { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
.item.done { background: var(--surface2); }
.item .meta { flex: 1; min-width: 0; overflow-wrap: anywhere; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; width: 100%; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.06);
}
.tabs-in {
  max-width: 720px; width: 100%; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
}
.tab {
  min-width: 0; width: 100%; padding: 0 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  height: 58px; color: var(--muted); text-decoration: none;
  font-size: clamp(10px, 2.8vw, 11.5px); font-weight: 500;
  border-top: 2.5px solid transparent;
}
.tab svg { width: 21px; height: 21px; flex: none; }
.tab span { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
.tab[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }

.vids { display: flex; flex-direction: column; gap: 8px; }
.vid { display: flex; gap: 10px; align-items: flex-start; text-decoration: none; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; overflow-wrap: anywhere; }
.vid:hover { border-color: var(--tc, var(--accent)); }
.vid:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vid svg { flex: none; margin-top: 3px; color: var(--tc, var(--accent)); }
.vid span { min-width: 0; }
.step.done .vid { background: var(--surface); }
.msg { font-size: 14px; }
.msg.err { color: var(--danger); }
.msg.ok { color: var(--ok); }
.code { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; padding: 3px 10px; border-radius: 999px;
  background: var(--surface2); color: var(--muted);
}
.pill.ok { color: var(--ok); }
.pill.err { color: var(--danger); }

.modal-back {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0, 0, 0, 0.72);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-box {
  background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 18px;
  max-width: 420px; width: 100%; padding: 18px;
  display: flex; flex-direction: column; gap: 14px;
  max-height: 90vh; overflow-y: auto;
}
.modal-photo {
  width: 100%; max-height: 360px; object-fit: contain;
  border-radius: 12px; background: var(--surface2);
}

.toast {
  position: fixed; left: 50%; bottom: calc(74px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); z-index: 40;
  background: var(--accent); color: var(--accent-fg);
  padding: 10px 18px; border-radius: 999px;
  font-size: 14px; font-weight: 500;
  box-shadow: 0 6px 24px rgba(0,0,0,0.28);
  pointer-events: none; max-width: calc(100vw - 32px); text-align: center;
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

  function isObj(x) { return x && typeof x === "object" && !Array.isArray(x); }

  function normalize(o) {
    var r = {
      v: 2, done: {}, notes: {}, custom: [], last: null, seen: {},
      bio: {}, bioc: [], bioPhotos: {}, nts: [], ai: {},
      use: { d: "", n: 0, t: 0, byProv: {} },
      providers: [], autoPhotos: true,
      customTopics: [], topicEdits: {}, stepEdits: {}, customSteps: {},
      updated: 0
    };
    if (!isObj(o)) return r;
    if (isObj(o.done)) Object.keys(o.done).forEach(function (k) { if (typeof o.done[k] === "number") r.done[k] = o.done[k]; });
    if (isObj(o.notes)) Object.keys(o.notes).forEach(function (k) { if (typeof o.notes[k] === "string") r.notes[k] = o.notes[k].slice(0, 4000); });
    if (Array.isArray(o.custom)) {
      o.custom.forEach(function (c) {
        if (!isObj(c) || typeof c.id !== "string" || typeof c.title !== "string") return;
        r.custom.push({
          id: c.id.slice(0, 40), topic: String(c.topic || "art"), kind: typeof c.kind === "string" ? c.kind.slice(0, 20) : "Лекция",
          title: c.title.slice(0, 200), url: typeof c.url === "string" ? c.url.slice(0, 500) : "",
          done: typeof c.done === "number" ? c.done : 0, added: typeof c.added === "number" ? c.added : 0
        });
      });
    }
    if (isObj(o.last) && o.last.topic) r.last = { topic: String(o.last.topic), id: String(o.last.id || ""), ts: Number(o.last.ts) || 0 };
    if (isObj(o.seen)) Object.keys(o.seen).forEach(function (k) { if (typeof o.seen[k] === "number") r.seen[k] = o.seen[k]; });
    if (Array.isArray(o.bioc)) {
      o.bioc.slice(0, 400).forEach(function (c) {
        if (!isObj(c) || typeof c.id !== "string" || typeof c.name !== "string" || !c.name.trim()) return;
        r.bioc.push({
          id: c.id.slice(0, 40), name: c.name.slice(0, 80),
          cat: Math.max(0, Math.min(BIO_CATS.length - 1, Number(c.cat) || 0)),
          desc: typeof c.desc === "string" ? c.desc.slice(0, 200) : "",
          photo: typeof c.photo === "string" ? c.photo.slice(0, 800) : "",
          ts: Number(c.ts) || 0
        });
      });
    }
    if (isObj(o.bio)) Object.keys(o.bio).forEach(function (k) { if (typeof o.bio[k] === "number") r.bio[k.slice(0, 80)] = o.bio[k]; });
    if (isObj(o.bioPhotos)) Object.keys(o.bioPhotos).slice(0, 800).forEach(function (k) { if (typeof o.bioPhotos[k] === "string") r.bioPhotos[k.slice(0, 80)] = o.bioPhotos[k].slice(0, 800); });
    if (Array.isArray(o.nts)) {
      o.nts.slice(0, 500).forEach(function (n) {
        if (!isObj(n) || typeof n.id !== "string" || typeof n.text !== "string") return;
        r.nts.push({ id: n.id.slice(0, 40), topic: typeof n.topic === "string" ? n.topic : "", text: n.text.slice(0, 8000), pin: !!n.pin, ts: Number(n.ts) || 0, upd: Number(n.upd) || 0 });
      });
    }
    if (isObj(o.ai)) {
      Object.keys(o.ai).slice(0, 400).forEach(function (k) {
        var a = o.ai[k];
        if (!/^(story|start|links):/.test(k) || !isObj(a) || typeof a.text !== "string") return;
        r.ai[k.slice(0, 100)] = { text: a.text.slice(0, 4000), sources: Array.isArray(a.sources) ? a.sources.slice(0, 5) : [], ts: Number(a.ts) || 0 };
      });
    }
    if (isObj(o.use)) {

  function getAllTopics() {

  function getStepsForTopic(tid) {
    var out = [];
    if (RAW[tid]) {
      RAW[tid].forEach(function (r, i) {
        var sid = tid + "-" + (i + 1);
        var ed = S.stepEdits[sid];
        if (ed && ed.deleted) return;
        out.push({
          id: sid,
          topic: tid,
          builtin: true,
          lv: ed && ed.lv ? Number(ed.lv) : r[0],
          t: ed && ed.t != null ? ed.t : r[1],
          a: ed && ed.a != null ? ed.a : r[2],
          k: ed && Array.isArray(ed.k) ? ed.k : r[3].split(","),
          q: ed && ed.q != null ? ed.q : r[4],
          w: ed && ed.w != null ? ed.w : r[5],
          v: ed && Array.isArray(ed.v) ? ed.v : (VID[sid] || [])
        });
      });
    }
    var csteps = S.customSteps[tid] || [];
    csteps.forEach(function (cs) {
      var ed = S.stepEdits[cs.id];
      if (ed && ed.deleted) return;
      out.push({
        id: cs.id,
        topic: tid,
        builtin: false,
        lv: ed && ed.lv ? Number(ed.lv) : (Number(cs.lv) || 1),
        t: ed && ed.t != null ? ed.t : cs.t,
        a: ed && ed.a != null ? ed.a : cs.a,
        k: ed && Array.isArray(ed.k) ? ed.k : (Array.isArray(cs.k) ? cs.k : []),
        q: ed && ed.q != null ? ed.q : (cs.q || cs.t),
        w: ed && ed.w != null ? ed.w : (cs.w || ""),
        v: ed && Array.isArray(ed.v) ? ed.v : (Array.isArray(cs.v) ? cs.v : [])
      });
    });
    out.sort(function (a, b) { return a.lv - b.lv; });
    out.forEach(function (s, idx) { s.n = idx + 1; });
    return out;
  }

  function totalStepsCount() {

  function activeProviders() {

    return S.providers.filter(function (p) {

    }).sort(function (a, b) {
      var aCool = (a.cooldownUntil || 0) > now ? 1 : 0;
      var bCool = (b.cooldownUntil || 0) > now ? 1 : 0;
      return aCool - bCool;
    });
  }

    }
    var now = Date.now();
    var ready = list.filter(function (p) { return (p.cooldownUntil || 0) <= now; });
    if (ready.length) {
      b.textContent = "ИИ: " + ready[0].name;
    } else {

      headers["X-Title"] = "Amin App";
    }
    return fetch(p.url.trim(), {
      method: "POST",

      if (!res.ok) {

      if (!text) throw new Error("Пустой ответ от модели");

  function runAiChain(prompt, wantJson) {
    var list = activeProviders();
    if (!list.length) {
      return Promise.reject({ code: "no_providers", message: "Не добавлен ни один API-ключ. Откройте «Настройки» и подключите DeepSeek, Gemini или OpenRouter." });
    }
    var idx = 0;
    var errors = [];
    function tryNext() {
      if (idx >= list.length) {
        save();
        return Promise.reject({
          code: "all_failed",
          message: "Ни одна из подключённых нейросетей не смогла ответить (" + errors.join("; ") + "). Проверьте ключи или баланс в Настройках."
        });
      }
      var p = list[idx++];
      return callSingleProvider(p, prompt, wantJson).catch(function (err) {
        var st = err.status || 0;
        if (st === 429) {
          /* Лимит запросов: ставим на паузу 65 секунд и переключаемся на следующую нейросеть */
          p.cooldownUntil = Date.now() + 65000;
          p.lastErr = "Лимит запросов (429), пауза 1 мин";
        } else if (st === 402) {
          /* Закончились кредиты/баланс: пауза на 12 часов, пусть работает следующая */
          p.cooldownUntil = Date.now() + 12 * 3600000;
          p.lastErr = "Закончился баланс (402)";
        } else if (st === 401 || st === 403) {
          p.cooldownUntil = Date.now() + 3600000;
          p.lastErr = "Неверный ключ (" + st + ")";
        } else {
          p.cooldownUntil = Date.now() + 30000;
          p.lastErr = err.message || "Ошибка сети";
        }
        errors.push(p.name + ": " + p.lastErr);
        return tryNext();
      });
    }
    return tryNext();
  }

  function extractJson(raw) {

    var firstBrace = s.indexOf("{");
    var lastBrace = s.lastIndexOf("}");
    if (firstBrace >= 0 && lastBrace > firstBrace) {
      s = s.slice(firstBrace, lastBrace + 1);
    }
    return JSON.parse(s);
  }

  function fetchWikiPhoto(name) {
    var cleanName = String(name).split(" и ")[0].trim();
    var ruUrl = "https://ru.wikipedia.org/w/api.php?action=query&titles=" + encodeURIComponent(cleanName) + "&prop=pageimages&format=json&pithumbsize=320&redirects=1&origin=*";
    return fetch(ruUrl).then(function (r) { return r.json(); }).then(function (d) {
      var pages = d && d.query && d.query.pages;
      if (pages) {
        var pids = Object.keys(pages);
        for (var i = 0; i < pids.length; i++) {
          if (pages[pids[i]].thumbnail && pages[pids[i]].thumbnail.source) {
            return pages[pids[i]].thumbnail.source;
          }
        }
      }
      /* Fallback: поиск в русской Википедии по запросу */
      var searchUrl = "https://ru.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=" + encodeURIComponent(cleanName) + "&gsrlimit=1&prop=pageimages&format=json&pithumbsize=320&origin=*";
      return fetch(searchUrl).then(function (r2) { return r2.json(); }).then(function (d2) {
        var p2 = d2 && d2.query && d2.query.pages;
        if (p2) {
          var k2 = Object.keys(p2);
          if (k2.length && p2[k2[0]].thumbnail && p2[k2[0]].thumbnail.source) {
            return p2[k2[0]].thumbnail.source;
          }
        }
        return "";
      });
    }).catch(function () { return ""; });
  }

  function processPhotoQueue() {
    if (photoBusy || !photoQueue.length || !S.autoPhotos) return;

    if (Object.prototype.hasOwnProperty.call(photoCache, item.name) || getBioPhoto(item.name)) {
      photoBusy = false;
      processPhotoQueue();
      return;
    }
    fetchWikiPhoto(item.name).then(function (url) {
      photoCache[item.name] = url || "";

      if (url && item.onFound) item.onFound(url);
    }).then(function () {
      photoBusy = false;
      setTimeout(processPhotoQueue, 120);

  }

            testAiOk = true;
            testAiResult = r.provider + ": " + r.text;
            render(true);
          }, function (e) {
            testAiBusy = false;
            testAiOk = false;
            testAiResult = e.message || "Ошибка проверки.";
            render(true);
          });
        } }) : null,
        S.providers.some(function (x) { return (x.cooldownUntil || 0) > Date.now(); })
          ? el("button", { class: "ghost", type: "button", text: "Сбросить паузы", onclick: function () {
              S.providers.forEach(function (x) { x.cooldownUntil = 0; x.lastErr = ""; });
              save();
              showToast("Паузы сброшены");
              render(true);
            } }) : null),
      testAiResult ? el("p", { class: "msg " + (testAiOk ? "ok" : "err"), text: testAiResult }) : null));

    wrap.appendChild(aiSec);

    /* 2. Биографии и фото */
    var autoCb = el("input", { type: "checkbox", checked: S.autoPhotos, style: "width:18px;height:18px;min-height:auto" });
    autoCb.addEventListener("change", function () {
      S.autoPhotos = autoCb.checked;
      save();
      showToast(S.autoPhotos ? "Автопоиск фото включён" : "Автопоиск фото выключен");
    });

    wrap.appendChild(el("section", { class: "stack-sm" },
      el("h2", { text: "Биографии и фотографии" }),
      el("div", { class: "card stack-sm" },
        el("label", { class: "row", style: "cursor:pointer;color:var(--fg)" }, autoCb, "Автоматически подгружать портреты личностей из энциклопедии"),
        el("div", { class: "row" },
          el("button", { class: "btn alt sm", type: "button", text: "Обновить кэш фотографий", onclick: function () {
            photoCache = {};
            savePhotoCache();
            showToast("Кэш очищен, фото загрузятся заново");
          } })))));

    /* 3. Темы и шаги */
    var hiddenTopicsCount = Object.keys(S.topicEdits).filter(function (k) { return S.topicEdits[k] && S.topicEdits[k].hidden; }).length;
    var editedStepsCount = Object.keys(S.stepEdits).length;
    wrap.appendChild(el("section", { class: "stack-sm" },
      el("h2", { text: "Учебные темы" }),
      el("div", { class: "card stack-sm" },
        el("p", { class: "small muted", text: "Скрыто встроенных тем: " + hiddenTopicsCount + ". Изменено или удалено встроенных шагов: " + editedStepsCount + "." }),
        el("div", { class: "row" },
          el("button", { class: "btn alt sm", type: "button", text: "Вернуть все стандартные темы и шаги", onclick: function () {
            S.topicEdits = {};
            S.stepEdits = {};
            save();
            showToast("Стандартные темы и шаги восстановлены");
            render(true);
          } })))));

    /* 4. Резервная копия (скачивание и загрузка файла) */
    var out = el("textarea", { class: "code", id: "export", readonly: true, "aria-label": "Резервная копия" });
    out.value = JSON.stringify(S);
    var copyMsg = el("p", { class: "msg", role: "status", text: ui.copyMsg });
    var fileMsg = el("p", { class: "msg" + (ui.fileErr ? " err" : ""), role: "status", text: ui.fileMsg || "" });
    var fileIn = el("input", { type: "file", id: "import-file", accept: ".json,application/json,text/plain", "aria-label": "Файл копии" });
    fileIn.addEventListener("change", function () {
      var f = fileIn.files && fileIn.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var txt = String(fr.result || "").trim();
          var o = JSON.parse(txt);
          if (!isObj(o) || !isObj(o.done)) throw new Error("bad");
          ui.pendingJson = txt; ui.restoreAsk = true; ui.importMsg = ""; ui.importErr = false;
          ui.fileMsg = "Файл прочитан. Подтвердите замену данных ниже."; ui.fileErr = false;
        } catch (e) { ui.fileMsg = "Это не похоже на файл копии."; ui.fileErr = true; }
        render(true);
      };
      fr.onerror = function () { ui.fileMsg = "Не удалось прочитать файл."; ui.fileErr = true; render(true); };
      fr.readAsText(f);
    });

    var saveFileBtn = el("button", { class: "btn", type: "button", text: "Скачать файл копии", onclick: function () {
      try {
        var blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "amin-backup.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        showToast("Файл amin-backup.json скачан");
      } catch (e) {
        ui.fileMsg = "Не удалось скачать файл. Используйте копирование текста ниже.";
        ui.fileErr = true;
        render(true);
      }
    } });

    wrap.appendChild(el("section", { class: "stack" },
      el("h2", { text: "Резервная копия и данные" }),
      el("p", { class: "small muted", text: "Все данные (прогресс, ключи нейросетей, свои темы, фото и заметки) хранятся локально в этом браузере. Сохраняйте копию в файл, чтобы не потерять прогресс." }),
      el("div", { class: "row" },
        saveFileBtn,
        el("button", { class: "btn alt", type: "button", text: "Скопировать JSON", onclick: function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(out.value).then(function () {
              showToast("Скопировано в буфер обмена");
            }, function () { out.focus(); out.select(); showToast("Текст выделен — скопируйте вручную"); });
          } else { out.focus(); out.select(); showToast("Текст выделен — скопируйте вручную"); }
        } })),
      copyMsg,
      el("div", null, el("label", { for: "import-file", text: "Загрузить из файла (.json)" }), fileIn),
      fileMsg,
      out));

    /* 5. Восстановление из текста */
    var inp = el("textarea", { class: "code", id: "import", placeholder: "Вставьте сюда сохранённый текст копии JSON", "aria-label": "Текст копии для восстановления" });
    var impMsg = el("p", { class: "msg" + (ui.importErr ? " err" : ""), role: "status", text: ui.importMsg });
    var restoreRow = el("div", { class: "row" });
    if (ui.restoreAsk) {
      restoreRow.appendChild(el("button", { class: "btn danger", type: "button", text: "Да, заменить данные", onclick: function () {
        try {
          var o = normalize(JSON.parse(ui.pendingJson));
          S = o; save();
          ui.importMsg = "Данные восстановлены."; ui.importErr = false;
          showToast("Данные успешно восстановлены");
        } catch (e) { ui.importMsg = "Не удалось прочитать копию."; ui.importErr = true; }
        ui.restoreAsk = false; ui.pendingJson = ""; render(true);
      } }));
      restoreRow.appendChild(el("button", { class: "btn alt", type: "button", text: "Отмена", onclick: function () { ui.restoreAsk = false; ui.pendingJson = ""; render(true); } }));
      impMsg.textContent = "Текущий прогресс будет заменён данными из копии. Продолжить?";
    } else {
      restoreRow.appendChild(el("button", { class: "btn alt", type: "button", text: "Восстановить из текста", onclick: function () {
        var txt = inp.value.trim();
        try {
          var o = JSON.parse(txt);
          if (!isObj(o) || !isObj(o.done)) throw new Error("bad");
          ui.pendingJson = txt; ui.restoreAsk = true; ui.importMsg = ""; ui.importErr = false;
        } catch (e) { ui.importMsg = "Это не похоже на копию данных."; ui.importErr = true; }
        render(true);
      } }));
    }
    wrap.appendChild(el("section", { class: "stack-sm" }, el("h2", { text: "Восстановление из текста" }), inp, restoreRow, impMsg));

    /* 6. Сброс */
    var resetRow = el("div", { class: "row" });
    if (ui.resetAsk) {
      resetRow.appendChild(el("button", { class: "btn danger", type: "button", text: "Да, стереть всё", onclick: function () {
        S = normalize({});
        save(); ui.resetAsk = false; openSteps = {}; showToast("Прогресс сброшен"); render(true);
      } }));
      resetRow.appendChild(el("button", { class: "btn alt", type: "button", text: "Отмена", onclick: function () { ui.resetAsk = false; render(true); } }));
    } else {
      resetRow.appendChild(el("button", { class: "btn danger", type: "button", text: "Сбросить весь прогресс", onclick: function () { ui.resetAsk = true; render(true); } }));
    }
    wrap.appendChild(el("section", { class: "stack-sm" }, el("h2", { text: "Сброс данных" }), el("p", { class: "muted small", text: "Удалит отметки, заметки, свои темы и настройки." }), resetRow));

    return wrap;
  }

  /* ---------- Отрисовка ---------- */
  var app = document.getElementById("app");
  function render(keep) {
    var scroller = document.getElementById("scroller");
    var y = scroller ? scroller.scrollTop : 0;
    var r = route();
    var node;
    if (r === "topics") node = topicsView();
    else if (r === "random") node = randomView();
    else if (r === "people") node = bioView();
    else if (r === "notes") node = notesView();
    else if (r === "mine") node = mineView();
    else if (r === "data") node = settingsView();
    else if (r.indexOf("t-") === 0 && getTopicById(r.slice(2))) node = topicView(r.slice(2));
    else node = homeView();

    app.textContent = "";
    app.appendChild(node);

    var oldModal = document.querySelector(".modal-back");
    if (oldModal) oldModal.remove();
    var modal = renderBioModal();
    if (modal) document.body.appendChild(modal);

    var tab = r.indexOf("t-") === 0 ? "topics" : (r === "topics" || r === "mine" || r === "data" || r === "people" ? r : (r === "notes" ? "mine" : "home"));
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (a) {
      if (a.getAttribute("data-tab") === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });

    updateAiBadge();

    if (pendingScroll) {
      var target = document.getElementById(pendingScroll);
      pendingScroll = null;
      if (target) { target.scrollIntoView({ block: "start" }); return; }
    }
    if (scroller) scroller.scrollTop = keep ? y : 0;
  }

  window.addEventListener("hashchange", function () {
    ui.delAsk = ""; ui.resetAsk = false; ui.restoreAsk = false; ui.editTopicId = ""; ui.editStepId = "";
    render(false);
  });

  /* Иконка и PWA-манифест для установки на экран «Домой» как полноценное приложение */
  (function () {
    try {
      var c = document.createElement("canvas"); c.width = 512; c.height = 512;
      var g = c.getContext("2d");
      g.fillStyle = "#14161a"; g.fillRect(0, 0, 512, 512);
      g.fillStyle = "#ffffff"; g.font = "700 340px Georgia, 'Times New Roman', serif";
      g.textAlign = "center"; g.textBaseline = "alphabetic";
      g.fillText("А", 256, 375);
      var iconUrl = c.toDataURL("image/png");

      [["apple-touch-icon", "512x512"], ["icon", "512x512"]].forEach(function (x) {
        var l = document.createElement("link"); l.rel = x[0]; l.sizes = x[1]; l.href = iconUrl; document.head.appendChild(l);
      });

      var manifest = {
        name: "Амин",
        short_name: "Амин",
        start_url: ".",
        display: "standalone",
        background_color: "#0B0B0C",
        theme_color: "#14161a",
        icons: [{ src: iconUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }]
      };
      var mLink = document.createElement("link");
      mLink.rel = "manifest";
      mLink.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
      document.head.appendChild(mLink);
    } catch (e) {}
  })();

  loadLocal();
  render(false);
})();
</script>
</body>
</html>
